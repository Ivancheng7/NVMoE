<title id="title">Persistent QD4 full61 confirmation</title><desc id="desc">Evidence figure for the Colibri README.</desc>
<rect width="100%" height="100%" fill="#ffffff"/><text x="48" y="44" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#202124" text-anchor="start" font-weight="bold">Four persistent QD4 lanes cut prompt E2E</text><text x="48" y="73" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#6b7280" text-anchor="start" font-weight="normal">QD4 executes six routed jobs per layer in parallel while preserving every recorded semantic boundary.</text><text x="315.0" y="106" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#202124" text-anchor="middle" font-weight="bold">A. Paired prompt E2E (s)</text><line x1="82" y1="126" x2="82" y2="354" stroke="#202124" stroke-width="1"/><line x1="82" y1="354" x2="548" y2="354" stroke="#202124" stroke-width="1"/><line x1="77" y1="354.0" x2="548" y2="354.0" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/><text x="72" y="359.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal">140</text><line x1="77" y1="288.8571428571429" x2="548" y2="288.8571428571429" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/><text x="72" y="293.8571428571429" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal">160</text><line x1="77" y1="223.71428571428572" x2="548" y2="223.71428571428572" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/><text x="72" y="228.71428571428572" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal">180</text><line x1="77" y1="158.57142857142858" x2="548" y2="158.57142857142858" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/><text x="72" y="163.57142857142858" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal">200</text><line x1="132" y1="159.11632743257144" x2="172" y2="327.4851693696" stroke="#7f8792" stroke-width="1" stroke-dasharray="3 2"/><circle cx="132" cy="159.11632743257144" r="5" fill="#ffffff" stroke="#0072B2" stroke-width="2"/><rect x="167" y="322.4851693696" width="10" height="10" fill="#E69F00" stroke="#202124" stroke-width="0.8"/><text x="152" y="377" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#202124" text-anchor="middle" font-weight="bold">1</text><line x1="240" y1="166.46477751342854" x2="280" y2="333.36266507982856" stroke="#7f8792" stroke-width="1" stroke-dasharray="3 2"/><circle cx="240" cy="166.46477751342854" r="5" fill="#ffffff" stroke="#0072B2" stroke-width="2"/><rect x="275" y="328.36266507982856" width="10" height="10" fill="#E69F00" stroke="#202124" stroke-width="0.8"/><text x="260" y="377" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#202124" text-anchor="middle" font-weight="bold">2</text><line x1="348" y1="161.72694207994286" x2="388" y2="324.7842615759429" stroke="#7f8792" stroke-width="1" stroke-dasharray="3 2"/><circle cx="348" cy="161.72694207994286" r="5" fill="#ffffff" stroke="#0072B2" stroke-width="2"/><rect x="383" y="319.7842615759429" width="10" height="10" fill="#E69F00" stroke="#202124" stroke-width="0.8"/><text x="368" y="377" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#202124" text-anchor="middle" font-weight="bold">3</text><line x1="456" y1="154.34785458377138" x2="496" y2="320.59659334748574" stroke="#7f8792" stroke-width="1" stroke-dasharray="3 2"/><circle cx="456" cy="154.34785458377138" r="5" fill="#ffffff" stroke="#0072B2" stroke-width="2"/><rect x="491" y="315.59659334748574" width="10" height="10" fill="#E69F00" stroke="#202124" stroke-width="0.8"/><text x="476" y="377" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#202124" text-anchor="middle" font-weight="bold">4</text><circle cx="104" cy="391" r="5" fill="#ffffff" stroke="#0072B2" stroke-width="2"/><text x="117" y="396" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#0072B2" text-anchor="start" font-weight="bold">A: exact union reuse</text><rect x="280" y="386" width="10" height="10" fill="#E69F00" stroke="#202124" stroke-width="0.8"/><text x="296" y="396" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#E69F00" text-anchor="start" font-weight="bold">B: persistent QD4</text><text x="767.0" y="106" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#202124" text-anchor="middle" font-weight="bold">B. More routed bytes, less wall time</text><text x="624" y="140" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal">Routed H2D per request (GB)</text><rect x="624" y="158" width="121.01796495359997" height="19" rx="2" fill="#ffffff" stroke="#0072B2" stroke-width="2"/><text x="739.0179649536" y="173" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#202124" text-anchor="end" font-weight="bold">A  29.620</text><rect x="624" y="190" width="262.39677235199997" height="19" rx="2" fill="#E69F00" stroke="#E69F00" stroke-width="2"/><text x="880.396772352" y="205" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#202124" text-anchor="end" font-weight="bold">B  64.223</text><text x="624" y="252" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal">Median prompt E2E (s)</text><rect x="624" y="270" width="259.26154051394997" height="19" rx="2" fill="#ffffff" stroke="#0072B2" stroke-width="2"/><text x="877.26154051395" y="285" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#202124" text-anchor="end" font-weight="bold">A  199.432</text><rect x="624" y="302" width="193.12167057884994" height="19" rx="2" fill="#E69F00" stroke="#E69F00" stroke-width="2"/><text x="811.12167057885" y="317" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#202124" text-anchor="end" font-weight="bold">B  148.555</text><rect x="624" y="349" width="286" height="54" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="642" y="373" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#E69F00" text-anchor="start" font-weight="bold">B uses 4 persistent lanes</text><text x="642" y="393" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#202124" text-anchor="start" font-weight="normal">6 routed jobs per layer</text><text x="48" y="445" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#202124" text-anchor="start" font-weight="bold">Median: 199.432 s → 148.555 s. Ratio of medians: 1.34248x.</text><text x="48" y="472" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal">n = 4 paired ABBA; 4/4 exact and positive. Every run: 60/60 fixed-prefetch transitions ready, wait 0.</text><text x="48" y="497" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal">Recorded prompt E2E for this Rust-canonical mechanism comparison. It is not tok/s.</text><text x="48" y="521" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">Protocol SHA-256 617d7b09…; derived summary SHA-256 65ce6de1…</text></svg>
