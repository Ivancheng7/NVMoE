<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
<title id="title">SSD to RAM to VRAM execution path</title><desc id="desc">Evidence figure for the Colibri README.</desc>
<rect width="100%" height="100%" fill="#ffffff"/><text x="48" y="48" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#202124" text-anchor="start" font-weight="bold">One local memory hierarchy, one serial semantic path</text><text x="48" y="79" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6b7280" text-anchor="start" font-weight="normal">Placement may change speed. It must not change pinned weights, routes, or reduction order.</text><rect x="70" y="180" width="180" height="100" rx="10" fill="#ffffff" stroke="#0072B2" stroke-width="2"/><text x="160.0" y="222" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#0072B2" text-anchor="middle" font-weight="bold">Local SSD</text><text x="160.0" y="250" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="normal">64 pinned shards</text><rect x="300" y="180" width="180" height="100" rx="10" fill="#ffffff" stroke="#E69F00" stroke-width="2"/><text x="390.0" y="222" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#E69F00" text-anchor="middle" font-weight="bold">Bounded RAM</text><text x="390.0" y="250" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="normal">state + staging</text><rect x="530" y="180" width="180" height="100" rx="10" fill="#ffffff" stroke="#009E73" stroke-width="2"/><text x="620.0" y="222" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#009E73" text-anchor="middle" font-weight="bold">12GB VRAM</text><text x="620.0" y="250" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="normal">4 QD4 lanes</text><rect x="760" y="180" width="150" height="100" rx="10" fill="#ffffff" stroke="#CC79A7" stroke-width="2"/><text x="835.0" y="222" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#CC79A7" text-anchor="middle" font-weight="bold">61 layers</text><text x="835.0" y="250" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="normal">canonical path</text><line x1="250" y1="230" x2="292" y2="230" stroke="#202124" stroke-width="2"/><path d="M 292 230 l -9 -6 v 12 z" fill="#202124"/><line x1="480" y1="230" x2="522" y2="230" stroke="#202124" stroke-width="2"/><path d="M 522 230 l -9 -6 v 12 z" fill="#202124"/><line x1="710" y1="230" x2="752" y2="230" stroke="#202124" stroke-width="2"/><path d="M 752 230 l -9 -6 v 12 z" fill="#202124"/><text x="160" y="328" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="normal">original safetensors ranges</text><text x="390" y="328" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="normal">host staging is bounded</text><text x="620" y="328" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="normal">slot reuse after fences</text><line x1="835" y1="295" x2="835" y2="355" stroke="#202124" stroke-width="2"/><path d="M 835 355 l -7 -10 h 14 z" fill="#202124"/><text x="835" y="390" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#202124" text-anchor="middle" font-weight="bold">layer i must finish before layer i+1</text><text x="48" y="476" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">Source: docs/DISAGGREGATED_EXPERT_ARCHITECTURE.md, SHA-256 6213af96…</text></svg>
