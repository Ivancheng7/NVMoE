<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
<title id="title">Capacity comparison</title><desc id="desc">Evidence figure for the Colibri README.</desc>
<rect width="100%" height="100%" fill="#ffffff"/><text x="48" y="48" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#202124" text-anchor="start" font-weight="bold">The capacity problem</text><text x="48" y="79" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#6b7280" text-anchor="start" font-weight="normal">Checkpoint weights stay local. RAM and VRAM are bounded working windows.</text><rect x="48" y="118" width="410" height="230" rx="12" fill="#ffffff" stroke="#0072B2" stroke-width="3"/><text x="78" y="160" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#0072B2" text-anchor="start" font-weight="bold">PINNED CHECKPOINT</text><text x="78" y="218" font-family="Arial,Helvetica,sans-serif" font-size="38" fill="#0072B2" text-anchor="start" font-weight="bold">805.33 GiB</text><text x="78" y="252" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#202124" text-anchor="start" font-weight="bold">64 local checkpoint shards</text><text x="78" y="291" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#6b7280" text-anchor="start" font-weight="normal">864,721,029,744 bytes on local SSD</text><rect x="505" y="118" width="405" height="101" rx="12" fill="#ffffff" stroke="#009E73" stroke-width="3"/><text x="531" y="157" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#009E73" text-anchor="start" font-weight="bold">12 GiB VRAM</text><text x="531" y="188" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#202124" text-anchor="start" font-weight="normal">RTX 4080 Laptop</text><text x="880" y="163" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#009E73" text-anchor="end" font-weight="bold">67x smaller</text><rect x="505" y="247" width="405" height="101" rx="12" fill="#ffffff" stroke="#E69F00" stroke-width="3"/><text x="531" y="286" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#E69F00" text-anchor="start" font-weight="bold">32 GiB RAM</text><text x="531" y="317" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#202124" text-anchor="start" font-weight="normal">working state + staging</text><text x="880" y="292" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#E69F00" text-anchor="end" font-weight="bold">25x smaller</text><text x="48" y="411" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#6b7280" text-anchor="start" font-weight="normal">Evidence scope: checkpoint capacity compared with each fast-memory capacity.</text><text x="48" y="476" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">CAPACITY EVIDENCE · pinned checkpoint and recorded laptop</text></svg>
