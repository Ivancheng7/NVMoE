<title id="title">sm_120 steady per-token chain</title><desc id="desc">Steady per-token wall time from the pinned baseline through the residency default, plotted from zero. Only the last pair is a matched block.</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="48.00" y="42.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#202124" text-anchor="start" font-weight="bold">A steady token costs 5.59x less than the pinned baseline</text><text x="48.00" y="70.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#5f6368" text-anchor="start" font-weight="normal">Bars start at zero. Each run is a real 8-token request on sm_120, plotted from zero.</text><text x="318.00" y="150.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#202124" text-anchor="end" font-weight="bold">A  pinned baseline (anchor)</text><rect x="340.00" y="116.00" width="331.02" height="15.00" fill="#0072B2" stroke="#0072B2" stroke-width="1"/><text x="710.00" y="128.00" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#5f6368" text-anchor="start" font-weight="normal">12.873s</text><line x1="671.02" y1="106.00" x2="671.02" y2="133.00" stroke="#202124" stroke-width="2"/><text x="671.02" y="98.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#0072B2" text-anchor="middle" font-weight="bold">mean 12.873s</text><text x="710.00" y="114.00" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#5f6368" text-anchor="start" font-weight="normal">e2e 103.38s   n=1</text><text x="318.00" y="258.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#202124" text-anchor="end" font-weight="bold">C  residency off</text><rect x="340.00" y="224.00" width="78.71" height="15.00" fill="#E69F00" stroke="#E69F00" stroke-width="1"/><text x="710.00" y="236.00" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#5f6368" text-anchor="start" font-weight="normal">3.061s</text><rect x="340.00" y="243.00" width="81.31" height="15.00" fill="#E69F00" stroke="#E69F00" stroke-width="1"/><text x="710.00" y="255.00" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#5f6368" text-anchor="start" font-weight="normal">3.162s</text><rect x="340.00" y="262.00" width="83.39" height="15.00" fill="#E69F00" stroke="#E69F00" stroke-width="1"/><text x="710.00" y="274.00" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#5f6368" text-anchor="start" font-weight="normal">3.243s</text><rect x="340.00" y="281.00" width="84.03" height="15.00" fill="#E69F00" stroke="#E69F00" stroke-width="1"/><text x="710.00" y="293.00" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#5f6368" text-anchor="start" font-weight="normal">3.268s</text><line x1="421.86" y1="214.00" x2="421.86" y2="298.00" stroke="#202124" stroke-width="2"/><text x="421.86" y="206.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#E69F00" text-anchor="middle" font-weight="bold">mean 3.183s</text><text x="710.00" y="222.00" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#5f6368" text-anchor="start" font-weight="normal">e2e 39.48s   n=4</text><text x="318.00" y="366.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#202124" text-anchor="end" font-weight="bold">D  residency on</text><rect x="340.00" y="332.00" width="58.09" height="15.00" fill="#D55E00" stroke="#D55E00" stroke-width="1"/><text x="710.00" y="344.00" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#5f6368" text-anchor="start" font-weight="normal">2.259s</text><rect x="340.00" y="351.00" width="58.45" height="15.00" fill="#D55E00" stroke="#D55E00" stroke-width="1"/><text x="710.00" y="363.00" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#5f6368" text-anchor="start" font-weight="normal">2.273s</text><rect x="340.00" y="370.00" width="61.10" height="15.00" fill="#D55E00" stroke="#D55E00" stroke-width="1"/><text x="710.00" y="382.00" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#5f6368" text-anchor="start" font-weight="normal">2.376s</text><rect x="340.00" y="389.00" width="59.40" height="15.00" fill="#D55E00" stroke="#D55E00" stroke-width="1"/><text x="710.00" y="401.00" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#5f6368" text-anchor="start" font-weight="normal">2.310s</text><line x1="399.26" y1="322.00" x2="399.26" y2="406.00" stroke="#202124" stroke-width="2"/><text x="399.26" y="314.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#D55E00" text-anchor="middle" font-weight="bold">mean 2.304s</text><text x="710.00" y="330.00" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#5f6368" text-anchor="start" font-weight="normal">e2e 32.38s   n=4</text><line x1="340.00" y1="446.00" x2="700.00" y2="446.00" stroke="#202124" stroke-width="1.5"/><line x1="340.00" y1="446.00" x2="340.00" y2="453.00" stroke="#202124" stroke-width="1"/><text x="340.00" y="470.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f6368" text-anchor="middle" font-weight="normal">0</text><line x1="417.14" y1="446.00" x2="417.14" y2="453.00" stroke="#202124" stroke-width="1"/><text x="417.14" y="470.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f6368" text-anchor="middle" font-weight="normal">3</text><line x1="494.29" y1="446.00" x2="494.29" y2="453.00" stroke="#202124" stroke-width="1"/><text x="494.29" y="470.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f6368" text-anchor="middle" font-weight="normal">6</text><line x1="571.43" y1="446.00" x2="571.43" y2="453.00" stroke="#202124" stroke-width="1"/><text x="571.43" y="470.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f6368" text-anchor="middle" font-weight="normal">9</text><line x1="648.57" y1="446.00" x2="648.57" y2="453.00" stroke="#202124" stroke-width="1"/><text x="648.57" y="470.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f6368" text-anchor="middle" font-weight="normal">12</text><text x="520.00" y="494.00" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#202124" text-anchor="middle" font-weight="normal">steady per-token wall, seconds</text><text x="48.00" y="534.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#D55E00" text-anchor="start" font-weight="bold">A to D is 5.59x derived, across two stages measured at different times.</text><text x="48.00" y="558.00" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#5f6368" text-anchor="start" font-weight="normal">Only C to D is a matched block: median paired 1.378x, order alternating, drop_caches before every run.</text><text x="48.00" y="578.00" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#5f6368" text-anchor="start" font-weight="normal">A is an anchor from an earlier tree, not a baseline taken the same day.</text></svg>
