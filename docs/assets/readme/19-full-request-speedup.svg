<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Exact full-request speedup</title>
<desc id="desc">Baseline and accepted exact-engine P5/N3 full-request wall times shown from zero. Final points show both accepted candidate runs.</desc>

<defs>
  <pattern id="hatch-orange" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff"/>
    <path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" stroke="#E69F00" stroke-width="2"/>
  </pattern>
  <pattern id="hatch-sky" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#56B4E9"/>
    <path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" stroke="#ffffff" stroke-width="1.5"/>
  </pattern>
  <pattern id="dots-green" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#009E73"/>
    <circle cx="2" cy="2" r="1.2" fill="#ffffff"/>
    <circle cx="6" cy="6" r="1.2" fill="#ffffff"/>
  </pattern>
  <pattern id="cross-vermillion" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#D55E00"/>
    <path d="M0,0 L8,8 M8,0 L0,8" stroke="#ffffff" stroke-width="1"/>
  </pattern>
  <pattern id="vertical-purple" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#CC79A7"/>
    <path d="M2,0 L2,8 M6,0 L6,8" stroke="#ffffff" stroke-width="1.2"/>
  </pattern>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48.00" y="42.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#202124" text-anchor="start" font-weight="bold">Full request latency fell 72.1%</text><text x="48.00" y="70.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6b7280" text-anchor="start" font-weight="normal">Exact P5/N3, 61 layers. Final bar is the geometric mean of two accepted candidate runs.</text><text x="272.00" y="166.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#202124" text-anchor="end" font-weight="bold">Exact baseline</text><rect x="290.00" y="135.00" width="443.11" height="54.00" rx="2" fill="url(#hatch-sky)" stroke="#56B4E9" stroke-width="2"/><text x="745.11" y="169.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#202124" text-anchor="start" font-weight="bold">198.948 s</text><text x="272.00" y="296.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#202124" text-anchor="end" font-weight="bold">Accepted engine</text><rect x="290.00" y="265.00" width="123.73" height="54.00" rx="2" fill="url(#cross-vermillion)" stroke="#D55E00" stroke-width="2"/><text x="425.73" y="299.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#202124" text-anchor="start" font-weight="bold">55.550 s</text><circle cx="415.29" cy="276.00" r="6.00" fill="#ffffff" stroke="#202124" stroke-width="2"/><rect x="406.18" y="302.00" width="12.00" height="12.00" rx="0" fill="#ffffff" stroke="#202124" stroke-width="2"/><text x="430.00" y="340.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold">Point markers: B1 56.253 s  |  B2 54.856 s</text><line x1="290.00" y1="365.00" x2="780.00" y2="365.00" stroke="#202124" stroke-width="1.5"/><line x1="290.00" y1="365.00" x2="290.00" y2="372.00" stroke="#202124" stroke-width="1"/><text x="290.00" y="390.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">0</text><line x1="401.36" y1="365.00" x2="401.36" y2="372.00" stroke="#202124" stroke-width="1"/><text x="401.36" y="390.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">50</text><line x1="512.73" y1="365.00" x2="512.73" y2="372.00" stroke="#202124" stroke-width="1"/><text x="512.73" y="390.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">100</text><line x1="624.09" y1="365.00" x2="624.09" y2="372.00" stroke="#202124" stroke-width="1"/><text x="624.09" y="390.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">150</text><line x1="735.45" y1="365.00" x2="735.45" y2="372.00" stroke="#202124" stroke-width="1"/><text x="735.45" y="390.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">200</text><text x="535.00" y="413.00" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#202124" text-anchor="middle" font-weight="normal">full request wall time, seconds</text><text x="48.00" y="438.00" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#D55E00" text-anchor="start" font-weight="bold">3.58x  |  72.1% less time  |  0.0151 to 0.0540 emitted tok/s</text><text x="48.00" y="470.00" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#202124" text-anchor="start" font-weight="bold">Final ABBA: n=2 per config. Every arm kept the same token and normalized BF16 digests.</text><text x="48.00" y="497.00" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal">The 3.58x baseline comparison is cross-lineage descriptive evidence. Bars start at zero.</text>
</svg>
