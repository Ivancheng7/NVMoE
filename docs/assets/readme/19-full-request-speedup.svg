<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Exact full-request speedup</title>
<desc id="desc">V8 and V9 full-request wall times shown from zero with exact internal-state checks.</desc>

<defs>
  <pattern id="hatch-orange" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff"/>
    <path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" stroke="#E69F00" stroke-width="2"/>
  </pattern>
  <pattern id="hatch-sky" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#56B4E9"/>
    <path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" stroke="#ffffff" stroke-width="1.5"/>
  </pattern>
  <pattern id="dots-green" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#009E73"/>
    <circle cx="2" cy="2" r="1.2" fill="#ffffff"/>
    <circle cx="6" cy="6" r="1.2" fill="#ffffff"/>
  </pattern>
  <pattern id="cross-vermillion" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#D55E00"/>
    <path d="M0,0 L8,8 M8,0 L0,8" stroke="#ffffff" stroke-width="1"/>
  </pattern>
  <pattern id="vertical-purple" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#CC79A7"/>
    <path d="M2,0 L2,8 M6,0 L6,8" stroke="#ffffff" stroke-width="1.2"/>
  </pattern>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48.00" y="42.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#202124" text-anchor="start" font-weight="bold">Exact full request: V9 completes the same P5/N3 request 2.23x faster</text><text x="48.00" y="70.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6b7280" text-anchor="start" font-weight="normal">P5/N3, 61 layers, same prompt IDs and greedy output, one development request per condition</text><text x="272.00" y="166.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#202124" text-anchor="end" font-weight="bold">V8, QD4 off</text><rect x="290.00" y="135.00" width="443.11" height="54.00" rx="2" fill="url(#hatch-sky)" stroke="#0072B2" stroke-width="2"/><text x="745.11" y="169.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#202124" text-anchor="start" font-weight="bold">198.947779573 s</text><text x="272.00" y="296.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#202124" text-anchor="end" font-weight="bold">V9, QD4 on</text><rect x="290.00" y="265.00" width="198.85" height="54.00" rx="2" fill="#D55E00" stroke="#D55E00" stroke-width="2"/><text x="500.85" y="299.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#202124" text-anchor="start" font-weight="bold">89.277349596 s</text><line x1="290.00" y1="365.00" x2="780.00" y2="365.00" stroke="#202124" stroke-width="1.5"/><line x1="290.00" y1="365.00" x2="290.00" y2="372.00" stroke="#202124" stroke-width="1"/><text x="290.00" y="390.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">0</text><line x1="401.36" y1="365.00" x2="401.36" y2="372.00" stroke="#202124" stroke-width="1"/><text x="401.36" y="390.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">50</text><line x1="512.73" y1="365.00" x2="512.73" y2="372.00" stroke="#202124" stroke-width="1"/><text x="512.73" y="390.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">100</text><line x1="624.09" y1="365.00" x2="624.09" y2="372.00" stroke="#202124" stroke-width="1"/><text x="624.09" y="390.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">150</text><line x1="735.45" y1="365.00" x2="735.45" y2="372.00" stroke="#202124" stroke-width="1"/><text x="735.45" y="390.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">200</text><text x="535.00" y="413.00" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#202124" text-anchor="middle" font-weight="normal">full request wall time, seconds</text><text x="48.00" y="438.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#D55E00" text-anchor="start" font-weight="bold">2.228423900x faster  |  latency down 55.125234%  |  0.015079334 to 0.033603148 emitted tok/s</text><text x="48.00" y="466.00" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal">PASS: 427 transactional commits and 183 exact layer-state audits. n=1 per condition; descriptive development evidence.</text><text x="48.00" y="506.00" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">V8 QD4 OFF AND V9 QD4 ON, FULL-REQUEST DEVELOPMENT COMPARISON</text>
</svg>
