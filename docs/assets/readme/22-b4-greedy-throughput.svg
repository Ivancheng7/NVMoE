<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Four-request B4 throughput and historical single-request latency</title>
  <desc id="desc">Panel A shows corrected raw A over B decode-time ratios of 1.28270855, 1.22929846, 1.07439173, and 1.10229862, with a symmetric geometric mean of 1.16899274 for default buffered one-step greedy B4. Its ratio axis starts at zero. Panel B separately shows the historical exact baseline and accepted P5 N3 single-request wall times from zero.</desc>
  <defs>
    <pattern id="blue-stripes" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0072B2"/>
      <path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" stroke="#ffffff" stroke-width="1.4"/>
    </pattern>
    <pattern id="orange-cross" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#E69F00"/>
      <path d="M0,0 L8,8 M8,0 L0,8" stroke="#ffffff" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="960" height="560" fill="#ffffff"/>
  <text x="48" y="42" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" fill="#202124">Four requests share each layer's fixed work</text>
  <text x="48" y="69" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#5f6368">Default buffered, one-step greedy B4. Four exact ABBA pairs on an RTX 4080 Laptop GPU with 12GB VRAM.</text>

  <rect x="42" y="94" width="568" height="392" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="64" y="126" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#202124">A. B4 aggregate decode throughput</text>
  <text x="64" y="149" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#5f6368">A: two B2 row sets, 243.475s median. B: one B4 row set, 209.960s median.</text>

  <line x1="150" y1="170" x2="150" y2="414" stroke="#202124" stroke-width="1.4"/>
  <line x1="150" y1="414" x2="555" y2="414" stroke="#202124" stroke-width="1.4"/>
  <line x1="294.64" y1="170" x2="294.64" y2="414" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="439.29" y1="170" x2="439.29" y2="414" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="488.17" y1="170" x2="488.17" y2="388" stroke="#E69F00" stroke-width="2" stroke-dasharray="5 4"/>

  <text x="136" y="186" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="end" fill="#202124">pair0 AB</text>
  <line x1="150" y1="181" x2="521.07" y2="181" stroke="#0072B2" stroke-width="5" stroke-linecap="round"/>
  <circle cx="521.07" cy="181" r="7" fill="#0072B2" stroke="#202124" stroke-width="1.2"/>
  <text x="533" y="186" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" fill="#202124">1.28270855</text>

  <text x="136" y="236" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="end" fill="#202124">pair1 BA</text>
  <line x1="150" y1="231" x2="505.62" y2="231" stroke="#56B4E9" stroke-width="5" stroke-linecap="round"/>
  <rect x="499.12" y="224.5" width="13" height="13" fill="#ffffff" stroke="#0072B2" stroke-width="2"/>
  <text x="518" y="236" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" fill="#202124">1.22929846</text>

  <text x="136" y="286" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="end" fill="#202124">pair2 BA</text>
  <line x1="150" y1="281" x2="460.81" y2="281" stroke="#56B4E9" stroke-width="5" stroke-linecap="round"/>
  <rect x="454.31" y="274.5" width="13" height="13" fill="#ffffff" stroke="#0072B2" stroke-width="2"/>
  <text x="473" y="286" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" fill="#202124">1.07439173</text>

  <text x="136" y="336" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="end" fill="#202124">pair3 AB</text>
  <line x1="150" y1="331" x2="468.88" y2="331" stroke="#0072B2" stroke-width="5" stroke-linecap="round"/>
  <circle cx="468.88" cy="331" r="7" fill="#0072B2" stroke="#202124" stroke-width="1.2"/>
  <text x="481" y="336" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" fill="#202124">1.10229862</text>

  <path d="M488.17 354 L497.17 363 L488.17 372 L479.17 363 Z" fill="#E69F00" stroke="#202124" stroke-width="1.2"/>
  <text x="468" y="389" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#8A5300">symmetric geometric mean</text>
  <text x="501" y="389" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#202124">1.1690x</text>

  <line x1="150" y1="414" x2="150" y2="421" stroke="#202124" stroke-width="1"/>
  <line x1="294.64" y1="414" x2="294.64" y2="421" stroke="#202124" stroke-width="1"/>
  <line x1="439.29" y1="414" x2="439.29" y2="421" stroke="#202124" stroke-width="1"/>
  <line x1="555" y1="414" x2="555" y2="421" stroke="#202124" stroke-width="1"/>
  <text x="150" y="441" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#5f6368">0.0</text>
  <text x="294.64" y="441" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#5f6368">0.5</text>
  <text x="439.29" y="441" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#5f6368">1.0</text>
  <text x="555" y="441" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#5f6368">1.4</text>
  <text x="352" y="467" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle" fill="#202124">A/B decode-time ratio, equal throughput at 1.0</text>

  <rect x="630" y="94" width="288" height="392" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="652" y="126" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#202124">B. Single-request wall time</text>
  <text x="652" y="149" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f6368">Historical cross-lineage P5/N3 comparison</text>

  <line x1="658" y1="430" x2="889" y2="430" stroke="#202124" stroke-width="1.4"/>
  <line x1="658" y1="170" x2="658" y2="430" stroke="#202124" stroke-width="1.4"/>
  <line x1="658" y1="311.82" x2="889" y2="311.82" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="658" y1="193.64" x2="889" y2="193.64" stroke="#e5e7eb" stroke-width="1"/>
  <text x="648" y="434" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="end" fill="#5f6368">0</text>
  <text x="648" y="316" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="end" fill="#5f6368">100</text>
  <text x="648" y="198" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="end" fill="#5f6368">200</text>

  <rect x="697" y="194.88" width="70" height="235.12" fill="url(#blue-stripes)" stroke="#0072B2" stroke-width="1.5"/>
  <rect x="805" y="364.35" width="70" height="65.65" fill="url(#orange-cross)" stroke="#E69F00" stroke-width="1.5"/>
  <text x="732" y="184" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#202124">198.948s</text>
  <text x="840" y="354" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#202124">55.550s</text>
  <text x="732" y="451" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#202124">baseline</text>
  <text x="840" y="451" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#202124">accepted</text>
  <text x="840" y="184" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#8A5300">3.58x</text>

  <text x="48" y="520" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#202124">Panel A: four paired B4 throughput observations, 4/4 exact in every pair. Panel B: separate historical wall-time estimand.</text>
  <text x="48" y="544" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f6368">Both quantitative axes start at zero. The two estimands remain separate and are never multiplied.</text>
</svg>
