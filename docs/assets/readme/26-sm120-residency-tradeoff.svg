<title id="title">sm_120 residency tradeoff</title><desc id="desc">Steady per-token time and peak device memory for the residency A/B arms, plotted from zero.</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="48.00" y="42.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#202124" text-anchor="start" font-weight="bold">Whole-model residency buys 0.879s/token for 6.35GB of VRAM</text><text x="48.00" y="70.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#5f6368" text-anchor="start" font-weight="normal">Same binary, only COLIBRI_V4_FIXED_RESIDENT_GIB differs. All 8 runs produced identical tokens.</text><text x="330.00" y="104.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#202124" text-anchor="start" font-weight="bold">steady per-token wall</text><text x="314.00" y="150.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#202124" text-anchor="end" font-weight="normal">C  residency off</text><rect x="330.00" y="128.00" width="424.47" height="30.00" fill="#E69F00" stroke="#E69F00" stroke-width="1"/><text x="763.47" y="149.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#202124" text-anchor="start" font-weight="bold">3.183s</text><text x="314.00" y="204.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#202124" text-anchor="end" font-weight="normal">D  residency on</text><rect x="330.00" y="182.00" width="307.27" height="30.00" fill="#D55E00" stroke="#D55E00" stroke-width="1"/><text x="646.27" y="203.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#202124" text-anchor="start" font-weight="bold">2.304s</text><text x="330.00" y="272.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#202124" text-anchor="start" font-weight="bold">peak device memory</text><text x="314.00" y="318.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#202124" text-anchor="end" font-weight="normal">C  residency off</text><rect x="330.00" y="296.00" width="97.34" height="30.00" fill="#E69F00" stroke="#E69F00" stroke-width="1"/><text x="436.34" y="317.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#202124" text-anchor="start" font-weight="bold">1825 MB</text><text x="314.00" y="372.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#202124" text-anchor="end" font-weight="normal">D  residency on</text><rect x="330.00" y="350.00" width="436.02" height="30.00" fill="#D55E00" stroke="#D55E00" stroke-width="1"/><text x="775.02" y="371.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#202124" text-anchor="start" font-weight="bold">8175 MB</text><text x="48.00" y="440.00" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#D55E00" text-anchor="start" font-weight="bold">peak 1.83 to 8.18 GB (+6.35 GB) for 0.879s/token off the steady frame.</text></svg>
