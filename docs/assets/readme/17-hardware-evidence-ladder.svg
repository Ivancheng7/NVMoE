<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
<title id="title">Evidence ladder: observed V4-Pro and projected Flash</title>
<desc id="desc">Observed V4-Pro development results and explicitly projected Flash envelopes.</desc>

<defs>
  <pattern id="hatch-orange" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff"/>
    <path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" stroke="#E69F00" stroke-width="2"/>
  </pattern>
  <pattern id="hatch-sky" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#56B4E9"/>
    <path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" stroke="#ffffff" stroke-width="1.5"/>
  </pattern>
  <pattern id="dots-green" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#009E73"/>
    <circle cx="2" cy="2" r="1.2" fill="#ffffff"/>
    <circle cx="6" cy="6" r="1.2" fill="#ffffff"/>
  </pattern>
  <pattern id="cross-vermillion" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#D55E00"/>
    <path d="M0,0 L8,8 M8,0 L0,8" stroke="#ffffff" stroke-width="1"/>
  </pattern>
  <pattern id="vertical-purple" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#CC79A7"/>
    <path d="M2,0 L2,8 M6,0 L6,8" stroke="#ffffff" stroke-width="1.2"/>
  </pattern>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48.00" y="42.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#202124" text-anchor="start" font-weight="bold">Evidence ladder: observed V4-Pro and projected Flash</text><text x="48.00" y="70.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6b7280" text-anchor="start" font-weight="normal">Observed runs and future estimates use separate evidence labels; read each rate within its workload.</text><rect x="48.00" y="105.00" width="864.00" height="73.00" rx="8" fill="#ffffff" stroke="#0072B2" stroke-width="2.2"/><text x="70.00" y="130.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#0072B2" text-anchor="start" font-weight="bold">OBSERVED DEVELOPMENT</text><text x="70.00" y="157.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#202124" text-anchor="start" font-weight="bold">V4-Pro P5/N3</text><text x="890.00" y="157.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#0072B2" text-anchor="end" font-weight="bold">0.015 to 0.034 emitted tok/s</text><text x="70.00" y="173.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">V8 and V9, one full request per condition</text><rect x="48.00" y="198.00" width="864.00" height="73.00" rx="8" fill="#ffffff" stroke="#E69F00" stroke-width="2.2" stroke-dasharray="8 5"/><text x="70.00" y="223.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#E69F00" text-anchor="start" font-weight="bold">PROJECTED, FLASH RUNS 0</text><text x="70.00" y="250.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#202124" text-anchor="start" font-weight="bold">Flash cold H1, 12 GiB</text><text x="890.00" y="250.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#E69F00" text-anchor="end" font-weight="bold">0.103 to 0.125 tok/s</text><text x="70.00" y="266.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">projection envelope</text><rect x="48.00" y="291.00" width="864.00" height="73.00" rx="8" fill="#ffffff" stroke="#009E73" stroke-width="2.2" stroke-dasharray="8 5"/><text x="70.00" y="316.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#009E73" text-anchor="start" font-weight="bold">PROJECTED, FLASH RUNS 0</text><text x="70.00" y="343.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#202124" text-anchor="start" font-weight="bold">Flash fixed-resident H1, 16 GiB</text><text x="890.00" y="343.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#009E73" text-anchor="end" font-weight="bold">0.313 to 0.658 tok/s</text><text x="70.00" y="359.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">residency is unimplemented</text><rect x="48.00" y="384.00" width="864.00" height="73.00" rx="8" fill="#ffffff" stroke="#CC79A7" stroke-width="2.2" stroke-dasharray="8 5"/><text x="70.00" y="409.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#CC79A7" text-anchor="start" font-weight="bold">PROJECTED, FLASH RUNS 0</text><text x="70.00" y="436.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#202124" text-anchor="start" font-weight="bold">Flash fixed-resident H2, 24 GiB</text><text x="890.00" y="436.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#CC79A7" text-anchor="end" font-weight="bold">0.548 to 1.153 committed tok/s</text><text x="70.00" y="452.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">q=0.8; draft and rollback costs unmeasured</text><text x="48.00" y="490.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">Flash projections assume a future port. Measured q, route union, residency, and scheduler span can change them.</text><text x="48.00" y="516.00" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">OBSERVED DEVELOPMENT AND PROJECTED ENVELOPES</text>
</svg>
