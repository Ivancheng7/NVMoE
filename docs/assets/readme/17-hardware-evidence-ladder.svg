<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48.00" y="42.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#202124" text-anchor="start" font-weight="bold">Measured / Calibrated / Target hardware evidence map</text><text x="48.00" y="70.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6b7280" text-anchor="start" font-weight="normal">Current evidence and future gates are separated because their models, estimands, and assumptions differ.</text><text x="48.00" y="93.00" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#D55E00" text-anchor="start" font-weight="bold">There is deliberately no shared rate axis: target gates are not hardware-derived predictions.</text><text x="48.00" y="132.00" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#202124" text-anchor="start" font-weight="bold">CURRENT EVIDENCE</text><text x="480.00" y="132.00" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#202124" text-anchor="start" font-weight="bold">FUTURE ACCEPTANCE GATES</text><rect x="48.00" y="150.00" width="392.00" height="126.00" rx="8" fill="#ffffff" stroke="#0072B2" stroke-width="2.5"/><circle cx="72.00" cy="176.00" r="8.00" fill="#0072B2" stroke="#202124" stroke-width="1.5"/><text x="92.00" y="181.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#0072B2" text-anchor="start" font-weight="bold">MEASURED</text><text x="70.00" y="215.00" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#202124" text-anchor="start" font-weight="bold">Pro · 12 GiB</text><text x="418.00" y="215.00" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#0072B2" text-anchor="end" font-weight="bold">0.027 next-token/s</text><text x="70.00" y="245.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">One position-5 development decode; not sustained throughput.</text><rect x="48.00" y="296.00" width="392.00" height="126.00" rx="8" fill="#ffffff" stroke="#E69F00" stroke-width="2.5"/><rect x="64.00" y="316.00" width="18.00" height="18.00" rx="1" fill="url(#hatch-orange)" stroke="#E69F00" stroke-width="1.5"/><text x="92.00" y="330.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#E69F00" text-anchor="start" font-weight="bold">CALIBRATED</text><text x="70.00" y="364.00" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#202124" text-anchor="start" font-weight="bold">Flash · 12 GiB</text><text x="418.00" y="364.00" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#E69F00" text-anchor="end" font-weight="bold">0.08–0.12 token/s</text><text x="70.00" y="394.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">Cold H1 projection; calibrated from Pro service. No Flash run.</text><rect x="480.00" y="150.00" width="432.00" height="105.00" rx="8" fill="#ffffff" stroke="#009E73" stroke-width="2.5" stroke-dasharray="8 5"/><rect x="496.00" y="165.00" width="20.00" height="20.00" rx="1" fill="#ffffff" stroke="#009E73" stroke-width="2" stroke-dasharray="5 3"/><text x="526.00" y="181.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#009E73" text-anchor="start" font-weight="bold">TARGET GATE</text><text x="502.00" y="213.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#202124" text-anchor="start" font-weight="bold">Flash · 16 GiB</text><text x="890.00" y="213.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#009E73" text-anchor="end" font-weight="bold">0.25–0.40 tok/s</text><text x="502.00" y="238.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">Requires unimplemented resident-fixed H1 path.</text><rect x="480.00" y="272.00" width="432.00" height="105.00" rx="8" fill="#ffffff" stroke="#009E73" stroke-width="2.5" stroke-dasharray="8 5"/><rect x="496.00" y="287.00" width="20.00" height="20.00" rx="1" fill="#ffffff" stroke="#009E73" stroke-width="2" stroke-dasharray="5 3"/><text x="526.00" y="303.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#009E73" text-anchor="start" font-weight="bold">TARGET GATE</text><text x="502.00" y="335.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#202124" text-anchor="start" font-weight="bold">Flash · 24 GiB</text><text x="890.00" y="335.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#009E73" text-anchor="end" font-weight="bold">0.50–1.00 committed tok/s</text><text x="502.00" y="360.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">H2 · q=0.8 assumed; not a prediction.</text><text x="890.00" y="360.00" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#D55E00" text-anchor="end" font-weight="bold">current H2 calibration: 0.20–0.29</text><rect x="480.00" y="394.00" width="432.00" height="105.00" rx="8" fill="#ffffff" stroke="#009E73" stroke-width="2.5" stroke-dasharray="8 5"/><rect x="496.00" y="409.00" width="20.00" height="20.00" rx="1" fill="#ffffff" stroke="#009E73" stroke-width="2" stroke-dasharray="5 3"/><text x="526.00" y="425.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#009E73" text-anchor="start" font-weight="bold">TARGET GATE</text><text x="502.00" y="457.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#202124" text-anchor="start" font-weight="bold">Flash · 32–48 GiB</text><text x="890.00" y="457.00" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#009E73" text-anchor="end" font-weight="bold">0.70–1.50 committed tok/s</text><text x="502.00" y="482.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">H5 · q=0.8 assumed; not a prediction.</text><text x="890.00" y="482.00" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#D55E00" text-anchor="end" font-weight="bold">current H5 calibration: 0.26–0.37</text><text x="48.00" y="548.00" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#D55E00" text-anchor="start" font-weight="bold">A Target is a future pass/fail threshold—not an estimate of what more VRAM will deliver.</text><text x="48.00" y="576.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">Target gates still require measured SSD/PCIe service, residency, context, q, route-hit, and overlap.</text><text x="48.00" y="636.00" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">Sources/formulas: cost-figures-provenance.json and docs/FLASH_MIGRATION_RESEARCH.md.</text>
</svg>
