[package]
name = "colibri-cuda"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "8d02eac17e56d5ed5ad3713fc498a2591d810919" }
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "8d02eac17e56d5ed5ad3713fc498a2591d810919" }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "8d02eac17e56d5ed5ad3713fc498a2591d810919" }
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
